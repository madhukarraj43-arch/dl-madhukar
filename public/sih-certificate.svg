<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <linearGradient id="appleBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e10" />
      <stop offset="50%" stop-color="#050505" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#d2d2d7" />
      <stop offset="100%" stop-color="#86868b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="850" fill="url(#appleBgGrad)" />

  <!-- Outer Border Frame -->
  <rect x="40" y="40" width="1120" height="770" rx="24" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" />
  <rect x="52" y="52" width="1096" height="746" rx="20" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" stroke-dasharray="8 6" />

  <!-- Top Authority Headers -->
  <text x="120" y="115" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="13" fill="#ffffff" font-weight="600" letter-spacing="3">GOVERNMENT OF INDIA</text>
  <text x="120" y="135" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" fill="#86868b">Ministry of Education's Innovation Cell (MIC)</text>

  <circle cx="600" cy="125" r="36" fill="rgba(255, 255, 255, 0.08)" stroke="#ffffff" stroke-width="1.5" />
  <text x="600" y="133" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">SIH</text>

  <text x="1080" y="115" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="13" fill="#ffffff" font-weight="600" letter-spacing="3" text-anchor="end">AICTE</text>
  <text x="1080" y="135" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" fill="#86868b" text-anchor="end">Smart India Hackathon 2026</text>

  <!-- Divider Line -->
  <line x1="120" y1="180" x2="1080" y2="180" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />

  <!-- Certificate Heading -->
  <text x="600" y="240" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="15" fill="#86868b" letter-spacing="6" text-anchor="middle">CERTIFICATE OF PARTICIPATION &amp; ACHIEVEMENT</text>
  <text x="600" y="275" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="16" fill="#a1a1a6" text-anchor="middle">This is proudly presented to</text>

  <!-- Recipient Name -->
  <text x="600" y="345" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="46" font-weight="700" fill="url(#silverGrad)" text-anchor="middle" letter-spacing="-1">MADHUKAR RAJ</text>
  <line x1="420" y1="365" x2="780" y2="365" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1" />

  <text x="600" y="405" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" fill="#f5f5f7" text-anchor="middle">B.Tech Computer Science &amp; Engineering (Core) • JECRC University, Jaipur</text>

  <!-- Body Content -->
  <text x="600" y="465" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" fill="#a1a1a6" text-anchor="middle">for exceptional technological innovation, architecture, and prototype implementation in</text>
  <text x="600" y="495" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">Smart India Hackathon (SIH) 2026</text>

  <!-- Problem Statement Card -->
  <rect x="250" y="530" width="700" height="70" rx="16" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
  <text x="600" y="555" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" fill="#86868b" letter-spacing="2" text-anchor="middle">PROBLEM STATEMENT:</text>
  <text x="600" y="580" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Manganese Reserve Estimation and Geospatial Resource Modeling</text>

  <!-- Footer Info & Signatures -->
  <line x1="120" y1="670" x2="1080" y2="670" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />

  <!-- Credential ID -->
  <text x="140" y="715" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" fill="#86868b">CREDENTIAL ID:</text>
  <text x="140" y="735" font-family="'SF Mono', monospace" font-size="14" font-weight="bold" fill="#ffffff">SIH2026-MR-MNG-9842</text>
  <text x="140" y="755" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" fill="#86868b">✓ Cryptographically Verified Credential</text>

  <!-- Official Seal -->
  <circle cx="600" cy="725" r="42" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5" />
  <circle cx="600" cy="725" r="36" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-dasharray="4 2" />
  <text x="600" y="718" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">OFFICIAL</text>
  <text x="600" y="733" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">SEAL</text>
  <text x="600" y="747" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="9" font-weight="bold" fill="#86868b" text-anchor="middle">2026</text>

  <!-- Authority Signatory -->
  <text x="1060" y="715" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" fill="#86868b" text-anchor="end">ORGANIZING COMMITTEE</text>
  <text x="1060" y="735" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="end">Ministry of Education's Innovation Cell</text>
  <text x="1060" y="755" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" fill="#86868b" text-anchor="end">AICTE, New Delhi</text>
</svg>
